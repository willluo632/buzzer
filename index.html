<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Bowl Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#08080a; --surface:#111113; --surface-2:#1a1a1e; --surface-3:#222228;
  --border:rgba(255,255,255,0.07); --border-md:rgba(255,255,255,0.13); --border-hi:rgba(255,255,255,0.22);
  --text:#f0f0f2; --text-sec:#8e8e9a; --text-muted:#4a4a58;
  --violet:#8b5cf6; --violet-lt:#a78bfa; --violet-glow:rgba(139,92,246,0.2);
  --cyan:#22d3ee; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
  --display:'Sora',sans-serif; --body:'Inter',system-ui,sans-serif;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;display:flex;flex-direction:column;}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:58px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);}
.nav-logo-mark{width:28px;height:28px;background:var(--violet);border-radius:7px;display:flex;align-items:center;justify-content:center;}
.nav-logo-mark svg{width:15px;height:15px;fill:white;}
.nav-logo-text{font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:-0.02em;}
.nav-right{display:flex;align-items:center;gap:0.75rem;}
.nav-pill{font-size:0.75rem;color:var(--text-sec);background:var(--surface-2);border:1px solid var(--border);border-radius:100px;padding:0.25rem 0.7rem;}
kbd{background:var(--surface-3);border:1px solid var(--border-md);border-radius:4px;padding:1px 5px;font-family:var(--body);font-size:0.7rem;color:var(--text-sec);}

/* LAYOUT */
.app{flex:1;display:grid;grid-template-columns:260px 1fr;min-height:0;}

/* SIDEBAR */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:1.25rem 1rem;gap:1.5rem;}
.sb-label{font-size:0.67rem;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.5rem;}
.filter-chips{display:flex;flex-direction:column;gap:0.3rem;}
.filter-chip{background:transparent;border:1px solid transparent;border-radius:8px;color:var(--text-sec);font-size:0.82rem;padding:0.4rem 0.65rem;cursor:pointer;transition:all 0.12s;text-align:left;font-family:var(--body);display:flex;align-items:center;gap:7px;}
.filter-chip:hover{background:var(--surface-2);color:var(--text);}
.filter-chip.active{background:var(--surface-3);border-color:var(--border-md);color:var(--text);}
.dot-cat{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.cat-all{background:linear-gradient(135deg,#a78bfa,#22d3ee);}
.cat-bio{background:#a78bfa;} .cat-chem{background:#22d3ee;} .cat-phys{background:#f59e0b;}
.cat-math{background:#4ade80;} .cat-earth{background:#60a5fa;} .cat-energy{background:#f97316;}
.q-list{display:flex;flex-direction:column;gap:0.25rem;overflow-y:auto;flex:1;}
.q-list-item{background:transparent;border:1px solid transparent;border-radius:8px;padding:0.5rem 0.65rem;cursor:pointer;text-align:left;font-family:var(--body);transition:all 0.12s;color:var(--text-sec);font-size:0.8rem;line-height:1.4;}
.q-list-item:hover{background:var(--surface-2);color:var(--text);}
.q-list-item.active{background:var(--surface-3);border-color:var(--border-md);color:var(--text);}
.q-list-item .item-meta{font-size:0.67rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:2px;}
.q-list-item.active .item-meta{color:var(--violet-lt);}
.vs-cg{display:flex;flex-direction:column;gap:0.45rem;}
.vs-cg label{font-size:0.7rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);display:flex;justify-content:space-between;}
.vs-cg label span{color:var(--violet-lt);font-weight:500;letter-spacing:0;text-transform:none;}
.vs-range{-webkit-appearance:none;width:100%;height:4px;background:var(--surface-3);border-radius:2px;border:1px solid var(--border);outline:none;cursor:pointer;}
.vs-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--violet);cursor:pointer;}
.vs-select{width:100%;background:var(--surface-3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--body);font-size:0.8rem;padding:0.4rem 0.65rem;outline:none;cursor:pointer;appearance:none;}
.vs-select option{background:#1a1a1e;}

/* STAGE */
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 2.5rem;overflow-y:auto;}
.idle-hint{text-align:center;color:var(--text-muted);}
.idle-hint svg{width:48px;height:48px;margin-bottom:1rem;opacity:0.3;}
.idle-hint p{font-size:0.9rem;line-height:1.6;}
.idle-hint strong{color:var(--text-sec);}
.q-stage{width:100%;max-width:760px;display:none;flex-direction:column;gap:1.25rem;}
.q-stage.visible{display:flex;}

/* HEADER BADGES */
.q-header{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;}
.badge{font-size:0.68rem;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;padding:0.22rem 0.65rem;border-radius:100px;}
.badge-cat{background:rgba(139,92,246,0.15);color:var(--violet-lt);}
.badge-toss{background:rgba(34,211,238,0.12);color:var(--cyan);}
.badge-bon{background:rgba(245,158,11,0.12);color:var(--amber);}
.badge-fmt{background:var(--surface-3);color:var(--text-sec);border:1px solid var(--border);}
.q-num{margin-left:auto;font-size:0.78rem;color:var(--text-muted);}

/* TEXT REVEAL BOX */
.q-text-area{background:var(--surface);border:1px solid var(--border-md);border-radius:18px;padding:1.75rem 2rem;min-height:160px;font-size:1.12rem;line-height:1.9;color:var(--text);position:relative;}
.q-text-area .preamble{color:var(--text-muted);font-size:0.9rem;}
.word{opacity:0;display:inline;}
.word.shown{opacity:1;}
.word-space{display:inline;}

/* BONUS */
.bonus-lead-box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:0.75rem 1rem;font-size:0.9rem;color:var(--text-sec);font-style:italic;}
.part-nav{display:flex;align-items:center;gap:0.5rem;}
.part-dot-btn{width:28px;height:28px;border-radius:50%;border:2px solid var(--border-md);background:var(--surface-3);cursor:pointer;transition:all 0.12s;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:600;color:var(--text-muted);font-family:var(--body);}
.part-dot-btn.active{border-color:var(--violet);background:var(--violet);color:white;}
.part-dot-btn.done-correct{border-color:var(--green);color:var(--green);background:rgba(34,197,94,0.1);}
.part-dot-btn.done-wrong{border-color:var(--red);color:var(--red);background:rgba(239,68,68,0.1);}
.part-dot-btn.done-skip{border-color:var(--text-muted);color:var(--text-muted);}

/* ANSWER REVEAL */
.answer-reveal{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:14px;padding:1rem 1.5rem;display:none;}
.answer-reveal.visible{display:block;}
.ans-label{font-size:0.67rem;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:rgba(34,197,94,0.7);margin-bottom:0.35rem;}
.ans-text{font-size:1.05rem;font-weight:600;color:var(--green);}

/* ANSWER INPUT ZONE */
.answer-zone{display:none;flex-direction:column;gap:0.75rem;}
.answer-zone.visible{display:flex;}
.answer-zone-label{font-size:0.7rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);}
.answer-input-row{display:flex;gap:0.6rem;align-items:center;}
.answer-input{flex:1;background:var(--surface-2);border:1px solid var(--border-md);border-radius:10px;color:var(--text);font-family:var(--body);font-size:0.95rem;padding:0.65rem 0.9rem;outline:none;transition:border-color 0.15s;}
.answer-input:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-glow);}
.answer-input.correct{border-color:var(--green);background:rgba(34,197,94,0.06);}
.answer-input.wrong{border-color:var(--red);background:rgba(239,68,68,0.06);}
.btn-submit{background:var(--violet);color:white;border:none;border-radius:10px;font-family:var(--body);font-size:0.88rem;font-weight:600;padding:0.65rem 1.1rem;cursor:pointer;white-space:nowrap;transition:background 0.15s;}
.btn-submit:hover{background:#7c3aed;}
.answer-feedback{font-size:0.88rem;font-weight:600;display:none;align-items:center;gap:6px;padding:0.6rem 0.9rem;border-radius:9px;}
.answer-feedback.visible{display:flex;}
.answer-feedback.correct{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);color:var(--green);}
.answer-feedback.wrong{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:var(--red);}

/* CONTROLS */
.controls-bar{display:flex;align-items:center;gap:0.65rem;flex-wrap:wrap;}
.btn-read{display:flex;align-items:center;gap:8px;background:var(--violet);color:white;border:none;border-radius:12px;font-family:var(--body);font-size:0.92rem;font-weight:600;padding:0.75rem 1.4rem;cursor:pointer;transition:background 0.15s,transform 0.1s;justify-content:center;}
.btn-read:hover{background:#7c3aed;} .btn-read:active{transform:scale(0.98);}
.btn-read.reading{background:var(--red);} .btn-read:disabled{opacity:0.3;cursor:not-allowed;}
.btn-buzz{display:none;align-items:center;gap:8px;background:var(--amber);color:#1a0e00;border:none;border-radius:12px;font-family:var(--body);font-size:0.92rem;font-weight:700;padding:0.75rem 1.4rem;cursor:pointer;transition:background 0.15s,transform 0.1s;}
.btn-buzz:hover{background:#d97706;} .btn-buzz:active{transform:scale(0.98);}
.btn-buzz.visible{display:flex;}
.btn-secondary{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border-md);border-radius:12px;color:var(--text-sec);font-family:var(--body);font-size:0.88rem;font-weight:500;padding:0.75rem 1rem;cursor:pointer;transition:border-color 0.15s,color 0.15s;white-space:nowrap;}
.btn-secondary:hover{border-color:var(--border-hi);color:var(--text);}
.nav-arrows{display:flex;gap:0.5rem;margin-left:auto;}
.nav-arr{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;color:var(--text-sec);padding:0.5rem 0.8rem;cursor:pointer;font-family:var(--body);font-size:0.82rem;transition:border-color 0.12s,color 0.12s;display:flex;align-items:center;gap:5px;}
.nav-arr:hover{border-color:var(--border-hi);color:var(--text);} .nav-arr:disabled{opacity:0.3;cursor:not-allowed;}

/* STATUS */
.status-bar{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:0.6rem 0.9rem;min-height:40px;}
.s-dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);flex-shrink:0;transition:background 0.2s;}
.s-dot.idle{background:var(--text-muted);}
.s-dot.reading{background:var(--violet-lt);box-shadow:0 0 6px var(--violet-glow);animation:pulse 1s infinite;}
.s-dot.buzzed{background:var(--amber);box-shadow:0 0 6px rgba(245,158,11,0.4);}
.s-dot.done{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,0.4);}
.s-dot.correct{background:var(--green);}
.s-dot.wrong{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.s-txt{font-size:0.82rem;color:var(--text-sec);flex:1;}
.s-wave{display:flex;align-items:center;gap:2px;height:16px;flex-shrink:0;}
.s-wb{width:3px;border-radius:2px;background:var(--violet);opacity:0.2;}
.s-wave.active .s-wb{opacity:1;animation:wv 0.8s ease-in-out infinite;}
.s-wb:nth-child(1){animation-delay:0s}.s-wb:nth-child(2){animation-delay:0.1s}
.s-wb:nth-child(3){animation-delay:0.2s}.s-wb:nth-child(4){animation-delay:0.15s}.s-wb:nth-child(5){animation-delay:0.05s}
@keyframes wv{0%,100%{height:3px}50%{height:14px}}

@media(max-width:700px){.app{grid-template-columns:1fr;}.sidebar{display:none;}.stage{padding:1.25rem 1rem;}.q-text-area{font-size:1rem;padding:1.25rem;}}
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">
    <div class="nav-logo-mark"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg></div>
    <span class="nav-logo-text">Science Bowl Reader</span>
  </a>
  <div class="nav-right">
    <span class="nav-pill" id="nav-count">50 questions</span>
    <span class="nav-pill" style="font-size:0.72rem;color:var(--text-muted)"><kbd>Space</kbd> read &nbsp;<kbd>B</kbd> buzz &nbsp;<kbd>←→</kbd> nav</span>
  </div>
</nav>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="sb-label">Category</div>
      <div class="filter-chips">
        <button class="filter-chip active" data-cat="ALL"><span class="dot-cat cat-all"></span>All categories</button>
        <button class="filter-chip" data-cat="BIOLOGY"><span class="dot-cat cat-bio"></span>Biology</button>
        <button class="filter-chip" data-cat="CHEMISTRY"><span class="dot-cat cat-chem"></span>Chemistry</button>
        <button class="filter-chip" data-cat="PHYSICS"><span class="dot-cat cat-phys"></span>Physics</button>
        <button class="filter-chip" data-cat="MATH"><span class="dot-cat cat-math"></span>Math</button>
        <button class="filter-chip" data-cat="EARTH AND SPACE"><span class="dot-cat cat-earth"></span>Earth &amp; Space</button>
        <button class="filter-chip" data-cat="ENERGY"><span class="dot-cat cat-energy"></span>Energy</button>
      </div>
    </div>
    <div>
      <div class="sb-label">Type</div>
      <div class="filter-chips">
        <button class="filter-chip active" data-type="ALL">All types</button>
        <button class="filter-chip" data-type="tossup">Tossups only</button>
        <button class="filter-chip" data-type="bonus">Bonuses only</button>
      </div>
    </div>
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;">
      <div class="sb-label">Questions</div>
      <div class="q-list" id="q-list"></div>
    </div>
    <div style="border-top:1px solid var(--border);padding-top:1rem;display:flex;flex-direction:column;gap:0.8rem;">
      <div class="sb-label">Voice settings</div>
      <div class="vs-cg"><label>Voice <span id="vs-voice-lbl">–</span></label><select id="vs-voice" class="vs-select"><option>Loading…</option></select></div>
      <div class="vs-cg"><label>Speed <span id="vs-rate-lbl">1.0×</span></label><input type="range" class="vs-range" id="vs-rate" min="0.5" max="2" step="0.1" value="1"></div>
      <div class="vs-cg"><label>Pitch <span id="vs-pitch-lbl">1.0</span></label><input type="range" class="vs-range" id="vs-pitch" min="0.5" max="2" step="0.1" value="1"></div>
    </div>
  </aside>

  <!-- STAGE -->
  <main class="stage" id="stage">
    <div class="idle-hint" id="idle-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <p>Select a question from the sidebar,<br>then press <strong>Read</strong> or <kbd>Space</kbd> to begin.</p>
    </div>

    <div class="q-stage" id="q-stage">
      <div class="q-header" id="q-header"></div>

      <!-- TOSSUP -->
      <div id="tossup-area" style="display:none;flex-direction:column;gap:1rem;">
        <div class="q-text-area" id="q-text-box"></div>
        <div class="answer-reveal" id="ans-reveal">
          <div class="ans-label">Correct Answer</div>
          <div class="ans-text" id="ans-text"></div>
        </div>
        <!-- answer input (shown after buzz) -->
        <div class="answer-zone" id="tossup-answer-zone">
          <div class="answer-zone-label">Your answer</div>
          <div class="answer-input-row">
            <input class="answer-input" id="tossup-answer-input" type="text" placeholder="Type your answer and press Enter…" autocomplete="off">
            <button class="btn-submit" onclick="submitTossupAnswer()">Submit</button>
          </div>
          <div class="answer-feedback" id="tossup-feedback"></div>
        </div>
      </div>

      <!-- BONUS -->
      <div id="bonus-area" style="display:none;flex-direction:column;gap:1rem;">
        <div class="bonus-lead-box" id="bonus-lead"></div>
        <div class="part-nav" id="part-nav"></div>
        <div class="q-text-area" id="bonus-text-box"></div>
        <!-- bonus answer zone (always visible between parts) -->
        <div class="answer-zone" id="bonus-answer-zone">
          <div class="answer-zone-label">Your answer for this part</div>
          <div class="answer-input-row">
            <input class="answer-input" id="bonus-answer-input" type="text" placeholder="Type your answer and press Enter…" autocomplete="off">
            <button class="btn-submit" onclick="submitBonusAnswer()">Submit</button>
          </div>
          <div class="answer-feedback" id="bonus-feedback"></div>
        </div>
        <div class="answer-reveal" id="bonus-ans-reveal">
          <div class="ans-label">Correct Answer</div>
          <div class="ans-text" id="bonus-ans-text"></div>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls-bar">
        <button class="btn-read" id="btn-read" onclick="handleRead()">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" id="read-icon"><path d="M8 5v14l11-7z"/></svg>
          <span id="read-lbl">Read</span>
        </button>
        <button class="btn-buzz" id="btn-buzz" onclick="handleBuzz()">⚡ Buzz in</button>
        <button class="btn-secondary" onclick="revealCurrentAnswer()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Show answer
        </button>
        <button class="btn-secondary" onclick="resetQuestion()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
          Reset
        </button>
        <div class="nav-arrows">
          <button class="nav-arr" id="btn-prev" onclick="navigate(-1)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg> Prev</button>
          <button class="nav-arr" id="btn-next" onclick="navigate(1)">Next <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
      </div>

      <div class="status-bar">
        <div class="s-dot idle" id="s-dot"></div>
        <span class="s-txt" id="s-txt">Ready</span>
        <div class="s-wave" id="s-wave">
          <div class="s-wb" style="height:3px"></div><div class="s-wb" style="height:7px"></div>
          <div class="s-wb" style="height:11px"></div><div class="s-wb" style="height:7px"></div><div class="s-wb" style="height:3px"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// ── QUESTIONS ──────────────────────────────────────────────────────────────────
const QUESTIONS = [
  { category:'BIOLOGY', type:'tossup', format:'Short Answer', tossup:'This organelle contains its own circular DNA and ribosomes resembling those of prokaryotes, supporting the endosymbiotic theory. Its inner membrane forms folds called cristae that dramatically increase surface area for the electron transport chain. For 4 points, name this double-membraned organelle that produces the majority of cellular ATP.', answer:'MITOCHONDRIA' },

// ── STATE ──────────────────────────────────────────────────────────────────────
let filtered=[...QUESTIONS], idx=0, catFilter='ALL', typeFilter='ALL';
const synth=window.speechSynthesis;
let voices=[], wordTimers=[], isReading=false, isSpeakingPreamble=false;
let buzzed=false, currentBonusPart=0;
let bonusPartResults=[]; // 'correct','wrong','skip' per part

// ── VOICE ──────────────────────────────────────────────────────────────────────
function loadVoices(){
  const raw=synth.getVoices(); if(!raw.length)return;
  const sel=document.getElementById('vs-voice'); sel.innerHTML='';
  voices=[...raw].sort((a,b)=>(a.lang.startsWith('en')?0:1)-(b.lang.startsWith('en')?0:1));
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o);});
  const ei=voices.findIndex(v=>v.lang.startsWith('en')); if(ei>=0)sel.value=ei;
  updateVoiceLbl();
}
if(synth){synth.onvoiceschanged=loadVoices;loadVoices();}
document.getElementById('vs-voice').addEventListener('change',updateVoiceLbl);
document.getElementById('vs-rate').addEventListener('input',()=>{document.getElementById('vs-rate-lbl').textContent=parseFloat(document.getElementById('vs-rate').value).toFixed(1)+'×';});
document.getElementById('vs-pitch').addEventListener('input',()=>{document.getElementById('vs-pitch-lbl').textContent=parseFloat(document.getElementById('vs-pitch').value).toFixed(1);});
function updateVoiceLbl(){const v=voices[document.getElementById('vs-voice').value];document.getElementById('vs-voice-lbl').textContent=v?v.lang:'–';}
function getRate(){return parseFloat(document.getElementById('vs-rate').value);}
function getVoice(){return voices[document.getElementById('vs-voice').value]||null;}
function getPitch(){return parseFloat(document.getElementById('vs-pitch').value);}

// ── FILTER / LIST ──────────────────────────────────────────────────────────────
document.querySelectorAll('.filter-chip[data-cat]').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.filter-chip[data-cat]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); catFilter=btn.dataset.cat; applyFilter();
}));
document.querySelectorAll('.filter-chip[data-type]').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.filter-chip[data-type]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); typeFilter=btn.dataset.type; applyFilter();
}));
function applyFilter(){stopAll();filtered=QUESTIONS.filter(q=>(catFilter==='ALL'||q.category===catFilter)&&(typeFilter==='ALL'||q.type===typeFilter));idx=0;buildList();loadQuestion();}
function buildList(){
  const list=document.getElementById('q-list'); list.innerHTML='';
  document.getElementById('nav-count').textContent=filtered.length+' questions';
  filtered.forEach((q,i)=>{
    const btn=document.createElement('button'); btn.className='q-list-item'+(i===idx?' active':'');
    btn.innerHTML=`<div class="item-meta">${q.category} · ${q.type}</div>${(q.type==='tossup'?q.tossup:q.lead).slice(0,55)}…`;
    btn.addEventListener('click',()=>{stopAll();idx=i;buildList();loadQuestion();});
    list.appendChild(btn);
  });
}

// ── LOAD QUESTION ──────────────────────────────────────────────────────────────
function loadQuestion(){
  stopAll(); buzzed=false; currentBonusPart=0; bonusPartResults=[];
  const q=filtered[idx]; if(!q)return;
  document.getElementById('idle-hint').style.display='none';
  document.getElementById('q-stage').classList.add('visible');
  document.querySelectorAll('.q-list-item').forEach((el,i)=>el.classList.toggle('active',i===idx));
  document.getElementById('btn-prev').disabled=idx===0;
  document.getElementById('btn-next').disabled=idx===filtered.length-1;
  document.getElementById('q-header').innerHTML=`
    <span class="badge badge-cat">${q.category}</span>
    <span class="badge ${q.type==='tossup'?'badge-toss':'badge-bon'}">${q.type.toUpperCase()}</span>
    ${q.type==='tossup'?`<span class="badge badge-fmt">${q.format}</span>`:''}
    <span class="q-num">${idx+1} / ${filtered.length}</span>`;
  if(q.type==='tossup'){
    document.getElementById('tossup-area').style.display='flex';
    document.getElementById('bonus-area').style.display='none';
    document.getElementById('q-text-box').innerHTML='';
    document.getElementById('ans-reveal').classList.remove('visible');
    document.getElementById('ans-text').textContent=q.answer;
    document.getElementById('tossup-answer-zone').classList.remove('visible');
    document.getElementById('tossup-answer-input').value='';
    document.getElementById('tossup-answer-input').className='answer-input';
    document.getElementById('tossup-feedback').className='answer-feedback';
    document.getElementById('tossup-feedback').style.display='none';
  } else {
    document.getElementById('tossup-area').style.display='none';
    document.getElementById('bonus-area').style.display='flex';
    document.getElementById('bonus-lead').textContent=q.lead;
    document.getElementById('bonus-text-box').innerHTML='';
    document.getElementById('bonus-ans-reveal').classList.remove('visible');
    document.getElementById('bonus-answer-zone').classList.remove('visible');
    document.getElementById('bonus-answer-input').value='';
    document.getElementById('bonus-answer-input').className='answer-input';
    document.getElementById('bonus-feedback').className='answer-feedback';
    document.getElementById('bonus-feedback').style.display='none';
    buildPartNav(q);
  }
  setStatus('idle','Ready — press Read or Space to begin');
  setReadBtn('idle');
  document.getElementById('btn-buzz').classList.remove('visible');
}

function buildPartNav(q){
  const nav=document.getElementById('part-nav');
  nav.innerHTML='<span style="font-size:0.75rem;color:var(--text-muted);margin-right:4px;">Part</span>';
  q.parts.forEach((_,i)=>{
    const btn=document.createElement('button');
    btn.className='part-dot-btn'+(i===currentBonusPart?' active':'');
    btn.id='part-dot-'+i; btn.textContent=i+1;
    nav.appendChild(btn);
  });
}
function updatePartNav(){
  const q=filtered[idx]; if(!q||q.type!=='bonus')return;
  q.parts.forEach((_,i)=>{
    const b=document.getElementById('part-dot-'+i); if(!b)return;
    b.className='part-dot-btn';
    if(bonusPartResults[i]==='correct') b.classList.add('done-correct');
    else if(bonusPartResults[i]==='wrong') b.classList.add('done-wrong');
    else if(bonusPartResults[i]==='skip') b.classList.add('done-skip');
    if(i===currentBonusPart) b.classList.add('active');
  });
}

// ── WORD REVEAL ────────────────────────────────────────────────────────────────
// Key fix: we speak preamble and question as SEPARATE utterances.
// Word reveal only starts when the question utterance begins (onstart callback).
// This guarantees perfect sync regardless of preamble length.

const MS_PER_WORD_BASE = 390; // calibrated ms per word at rate=1.0

function buildWordSpans(text, container){
  container.innerHTML='';
  const words=text.split(/(\s+)/);
  let wordIdx=0;
  words.forEach(tok=>{
    if(/^\s+$/.test(tok)){
      const s=document.createElement('span'); s.className='word-space'; s.textContent=tok; container.appendChild(s);
    } else if(tok.length>0){
      const s=document.createElement('span'); s.className='word'; s.id='w-'+wordIdx; s.textContent=tok; container.appendChild(s); wordIdx++;
    }
  });
  return wordIdx;
}

function revealWordsOverTime(container, totalWords, durationMs){
  clearWordTimers();
  if(totalWords===0)return;
  const msPerWord=durationMs/totalWords;
  for(let i=0;i<totalWords;i++){
    const t=setTimeout(()=>{const el=container.querySelector('#w-'+i);if(el)el.classList.add('shown');},i*msPerWord);
    wordTimers.push(t);
  }
}
function clearWordTimers(){wordTimers.forEach(t=>clearTimeout(t));wordTimers=[];}
function showAllWords(container){container.querySelectorAll('.word').forEach(el=>el.classList.add('shown'));}

function speakUtterance(text, onStart, onEnd){
  const u=new SpeechSynthesisUtterance(text);
  u.voice=getVoice(); u.rate=getRate(); u.pitch=getPitch();
  u.onstart=()=>{if(onStart)onStart();};
  u.onend=()=>{if(onEnd)onEnd();};
  u.onerror=(e)=>{if(e.error==='interrupted')return;if(onEnd)onEnd();};
  synth.speak(u);
}

function estimateDuration(text){
  const words=text.trim().split(/\s+/).length;
  return (words*MS_PER_WORD_BASE)/getRate();
}

// ── READ TOSSUP ────────────────────────────────────────────────────────────────
function readTossup(){
  const q=filtered[idx];
  const preamble=`Tossup. ${q.category}. ${q.format}.`;
  const box=document.getElementById('q-text-box');
  const totalWords=buildWordSpans(q.tossup, box);
  const estDur=estimateDuration(q.tossup);

  isReading=true; isSpeakingPreamble=true; buzzed=false;
  setReadBtn('reading');
  setStatus('reading','Reading preamble…');
  document.getElementById('btn-buzz').classList.remove('visible');

  // Step 1: speak preamble
  speakUtterance(preamble, null, ()=>{
    if(!isReading)return; // was stopped
    isSpeakingPreamble=false;
    setStatus('reading','Reading question…');
    document.getElementById('btn-buzz').classList.add('visible');

    // Step 2: speak question text — start word reveal exactly when speech begins
    speakUtterance(q.tossup,
      ()=>{ revealWordsOverTime(box, totalWords, estDur); },
      ()=>{
        if(!buzzed){
          clearWordTimers(); showAllWords(box);
          isReading=false;
          setReadBtn('done');
          document.getElementById('btn-buzz').classList.remove('visible');
          setStatus('done','Done reading — type your answer or reveal');
        }
      }
    );
  });
}

// ── READ BONUS PART ────────────────────────────────────────────────────────────
function readBonusPart(partIdx){
  const q=filtered[idx]; const part=q.parts[partIdx];
  currentBonusPart=partIdx; updatePartNav();
  document.getElementById('bonus-ans-reveal').classList.remove('visible');
  document.getElementById('bonus-answer-zone').classList.remove('visible');
  document.getElementById('bonus-answer-input').value='';
  document.getElementById('bonus-answer-input').className='answer-input';
  document.getElementById('bonus-feedback').className='answer-feedback';
  document.getElementById('bonus-feedback').style.display='none';

  const box=document.getElementById('bonus-text-box');
  const totalWords=buildWordSpans(part.q, box);
  const estDur=estimateDuration(part.q);

  isReading=true; buzzed=false;
  setReadBtn('reading');
  setStatus('reading',`Reading part ${partIdx+1} of ${q.parts.length}…`);

  speakUtterance(part.q,
    ()=>{ revealWordsOverTime(box, totalWords, estDur); },
    ()=>{
      clearWordTimers(); showAllWords(box);
      isReading=false;
      setReadBtn('done');
      // Show answer input
      document.getElementById('bonus-answer-zone').classList.add('visible');
      document.getElementById('bonus-ans-text').textContent=part.a;
      setStatus('done',`Part ${partIdx+1} done — type your answer`);
      setTimeout(()=>document.getElementById('bonus-answer-input').focus(),100);
    }
  );
}

function readBonus(){
  const q=filtered[idx];
  bonusPartResults=[];
  buildPartNav(q);
  document.getElementById('bonus-text-box').innerHTML='';
  document.getElementById('bonus-ans-reveal').classList.remove('visible');
  document.getElementById('bonus-answer-zone').classList.remove('visible');

  isReading=true; isSpeakingPreamble=true;
  setReadBtn('reading');
  setStatus('reading','Reading bonus lead…');

  speakUtterance(`Bonus. ${q.category}. ${q.lead}`, null, ()=>{
    if(!isReading)return;
    isSpeakingPreamble=false;
    readBonusPart(0);
  });
}

// ── ANSWER CHECKING ────────────────────────────────────────────────────────────
function normalise(s){
  return s.toLowerCase().trim()
    .replace(/[^a-z0-9\s]/g,'')
    .replace(/\s+/g,' ');
}

function checkAnswer(userRaw, correctRaw){
  const user=normalise(userRaw);
  const correct=normalise(correctRaw);
  if(user===correct)return true;
  // allow partial match: user answer is contained in correct or vice versa (for abbreviations etc.)
  if(correct.includes(user)&&user.length>2)return true;
  // word-level: all words the user typed appear in the correct answer
  const uWords=user.split(' ').filter(w=>w.length>1);
  const cWords=correct.split(' ');
  if(uWords.length>0&&uWords.every(w=>cWords.includes(w)))return true;
  return false;
}

function submitTossupAnswer(){
  const input=document.getElementById('tossup-answer-input');
  const fb=document.getElementById('tossup-feedback');
  const q=filtered[idx];
  const correct=checkAnswer(input.value, q.answer);
  input.className='answer-input '+(correct?'correct':'wrong');
  fb.className='answer-feedback '+(correct?'correct':'wrong');
  fb.style.display='flex';
  if(correct){
    fb.innerHTML='✓ Correct!';
    setStatus('correct','Correct answer!');
  } else {
    fb.innerHTML='✗ Incorrect';
    setStatus('wrong','Incorrect — showing answer');
    document.getElementById('ans-reveal').classList.add('visible');
  }
}

function submitBonusAnswer(){
  const input=document.getElementById('bonus-answer-input');
  const fb=document.getElementById('bonus-feedback');
  const q=filtered[idx];
  const part=q.parts[currentBonusPart];
  const correct=checkAnswer(input.value, part.a);

  input.className='answer-input '+(correct?'correct':'wrong');
  fb.className='answer-feedback '+(correct?'correct':'wrong');
  fb.style.display='flex';

  bonusPartResults[currentBonusPart]=correct?'correct':'wrong';
  updatePartNav();

  if(correct){
    fb.innerHTML='✓ Correct!';
    setStatus('correct','Correct!');
    document.getElementById('bonus-ans-reveal').classList.add('visible');
    // auto-advance to next part after 1.5s
    const nextPart=currentBonusPart+1;
    if(nextPart<q.parts.length){
      setTimeout(()=>{
        if(filtered[idx]===q) readBonusPart(nextPart);
      },1500);
    } else {
      setTimeout(()=>{ if(filtered[idx]===q) setStatus('done','Bonus complete!'); },1500);
    }
  } else {
    fb.innerHTML='✗ Incorrect — bonus part skipped';
    setStatus('wrong','Wrong — skipping to next part');
    document.getElementById('bonus-ans-reveal').classList.add('visible');
    // skip this part, move to next after 2s
    const nextPart=currentBonusPart+1;
    if(nextPart<q.parts.length){
      setTimeout(()=>{
        if(filtered[idx]===q) readBonusPart(nextPart);
      },2000);
    } else {
      setTimeout(()=>{ if(filtered[idx]===q) setStatus('done','Bonus complete!'); },2000);
    }
  }
}

// ── BUZZ IN ────────────────────────────────────────────────────────────────────
function handleBuzz(){
  if(!isReading||isSpeakingPreamble)return; // can't buzz during preamble
  buzzed=true; clearWordTimers(); synth.cancel(); isReading=false;
  document.getElementById('btn-buzz').classList.remove('visible');
  setReadBtn('idle');
  setStatus('buzzed','⚡ Buzzed! Type your answer below');
  document.getElementById('tossup-answer-zone').classList.add('visible');
  setTimeout(()=>document.getElementById('tossup-answer-input').focus(),100);
}

// ── HANDLE READ ────────────────────────────────────────────────────────────────
function handleRead(){
  const q=filtered[idx]; if(!q)return;
  if(isReading){stopAll();return;}
  synth.cancel();
  if(q.type==='tossup') readTossup();
  else readBonus();
}

// ── REVEAL ANSWER ──────────────────────────────────────────────────────────────
function revealCurrentAnswer(){
  const q=filtered[idx]; if(!q)return;
  if(q.type==='tossup'){
    document.getElementById('ans-reveal').classList.add('visible');
    setStatus('done','Answer revealed');
  } else {
    document.getElementById('bonus-ans-text').textContent=q.parts[currentBonusPart].a;
    document.getElementById('bonus-ans-reveal').classList.add('visible');
    setStatus('done','Answer revealed');
  }
}

// ── RESET ──────────────────────────────────────────────────────────────────────
function resetQuestion(){
  stopAll();
  const q=filtered[idx]; if(!q)return;
  buzzed=false; currentBonusPart=0; bonusPartResults=[];
  if(q.type==='tossup'){
    document.getElementById('q-text-box').innerHTML='';
    document.getElementById('ans-reveal').classList.remove('visible');
    document.getElementById('tossup-answer-zone').classList.remove('visible');
    document.getElementById('tossup-answer-input').value='';
    document.getElementById('tossup-answer-input').className='answer-input';
    document.getElementById('tossup-feedback').style.display='none';
  } else {
    document.getElementById('bonus-text-box').innerHTML='';
    document.getElementById('bonus-ans-reveal').classList.remove('visible');
    document.getElementById('bonus-answer-zone').classList.remove('visible');
    document.getElementById('bonus-answer-input').value='';
    document.getElementById('bonus-answer-input').className='answer-input';
    document.getElementById('bonus-feedback').style.display='none';
    buildPartNav(q);
  }
  setStatus('idle','Reset — press Read or Space to begin again');
  setReadBtn('idle');
  document.getElementById('btn-buzz').classList.remove('visible');
}

function stopAll(){
  clearWordTimers(); if(synth)synth.cancel();
  isReading=false; isSpeakingPreamble=false;
  setReadBtn('idle');
  document.getElementById('btn-buzz').classList.remove('visible');
}

// ── UI HELPERS ─────────────────────────────────────────────────────────────────
function setStatus(state,txt){
  document.getElementById('s-dot').className='s-dot '+state;
  document.getElementById('s-txt').textContent=txt;
  document.getElementById('s-wave').classList.toggle('active',state==='reading');
}
function setReadBtn(state){
  const btn=document.getElementById('btn-read'),lbl=document.getElementById('read-lbl'),icon=document.getElementById('read-icon');
  btn.classList.remove('reading');
  if(state==='reading'){btn.classList.add('reading');lbl.textContent='Stop';icon.innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';}
  else{const q=filtered[idx];lbl.textContent=q?(q.type==='bonus'?'Read bonus':'Read question'):'Read';icon.innerHTML='<path d="M8 5v14l11-7z"/>';}
}
function navigate(dir){stopAll();idx=Math.max(0,Math.min(filtered.length-1,idx+dir));buildList();loadQuestion();}

// ── KEYBOARD ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'){
    // Enter submits in input boxes
    if(e.key==='Enter'){
      if(e.target.id==='tossup-answer-input') submitTossupAnswer();
      if(e.target.id==='bonus-answer-input') submitBonusAnswer();
    }
    return;
  }
  if(e.key===' '){e.preventDefault();handleRead();}
  if(e.key==='b'||e.key==='B') handleBuzz();
  if(e.key==='a'||e.key==='A') revealCurrentAnswer();
  if(e.key==='r'||e.key==='R') resetQuestion();
  if(e.key==='ArrowRight'||e.key==='ArrowDown') navigate(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') navigate(-1);
});

// Enter in answer inputs
document.getElementById('tossup-answer-input').addEventListener('keydown',e=>{if(e.key==='Enter')submitTossupAnswer();});
document.getElementById('bonus-answer-input').addEventListener('keydown',e=>{if(e.key==='Enter')submitBonusAnswer();});

window.addEventListener('beforeunload',()=>synth&&synth.cancel());

// ── INIT ───────────────────────────────────────────────────────────────────────
buildList();
loadQuestion();
</script>
